name: Build Android APK

on:
  push:
    branches:
      - claude/marhaba-xw3rqm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold Android platform folder
        run: |
          flutter create --platforms=android --project-name masabaqa --org com.hijola /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          # cloud_firestore requires minSdkVersion 23; the default template sets it lower.
          # Cover both the legacy Groovy syntax and the newer AGP property names.
          sed -i \
            -e 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' \
            -e 's/minSdkVersion = flutter\.minSdkVersion/minSdkVersion = 23/' \
            -e 's/minSdk flutter\.minSdkVersion/minSdk 23/' \
            -e 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' \
            android/app/build.gradle
          # Firebase's Kotlin stdlib requires a newer Kotlin Gradle plugin than the default template pins.
          sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version )"[^"]+"/\1"2.1.0"/' android/settings.gradle
          echo "--- resulting build.gradle ---"
          cat android/app/build.gradle
          echo "--- resulting settings.gradle ---"
          cat android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masabaqa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-build-${{ github.run_number }}
          name: مسابقة - build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            بناء تلقائي لتطبيق "مسابقة" (Flutter).
            الوضع الفردي يعمل مباشرة بدون إعداد.
            أوضاع اللعب الجماعي تحتاج ربط المشروع بـ Firebase (راجع FIREBASE_SETUP.md).
