name: Build Android APK

on:
  push:
    branches:
      - claude/marhaba-xw3rqm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold Android platform folder
        run: |
          flutter create --platforms=android --project-name masabaqa --org com.hijola /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

          # Recent Flutter templates use Kotlin DSL (build.gradle.kts) instead
          # of Groovy (build.gradle) - find whichever one actually exists.
          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE=android/app/build.gradle.kts
          else
            GRADLE_FILE=android/app/build.gradle
          fi
          echo "Using $GRADLE_FILE"

          # cloud_firestore requires minSdkVersion 23; the default template sets it lower.
          # Cover Groovy, Kotlin DSL, and both "minSdkVersion"/"minSdk" property names.
          sed -i \
            -e 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' \
            -e 's/minSdkVersion = flutter\.minSdkVersion/minSdkVersion = 23/' \
            -e 's/minSdk flutter\.minSdkVersion/minSdk 23/' \
            -e 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' \
            -e 's/minSdk = flutter\.minSdkVersion\.get()/minSdk = 23/' \
            -e 's/minSdk = flutter\.minSdkVersion\.toInteger()/minSdk = 23/' \
            "$GRADLE_FILE"

          # Fail fast (with a clear message) instead of silently building an
          # APK that will crash at runtime, if none of the sed patterns above
          # matched a future Flutter template's exact wording.
          if grep -q 'flutter\.minSdkVersion' "$GRADLE_FILE"; then
            echo "ERROR: minSdkVersion patch did not match anything in $GRADLE_FILE."
            echo "The Flutter template's wording for this line has probably changed."
            echo "--- $GRADLE_FILE content ---"
            cat "$GRADLE_FILE"
            exit 1
          fi

          echo "--- resulting $GRADLE_FILE ---"
          cat "$GRADLE_FILE"
          echo "--- resulting settings.gradle(.kts) ---"
          cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle

          # Show "ق" as the app name on the phone's home screen / app drawer.
          sed -i 's/android:label="[^"]*"/android:label="ق"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masabaqa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-build-${{ github.run_number }}
          name: مسابقة - build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            بناء تلقائي لتطبيق "مسابقة" (Flutter).
            كل الأوضاع (فردي وجماعي) تعمل — المشروع متصل بـ Firebase.
            راجع FIREBASE_SETUP.md لخطوة أمان يدوية باقية (نشر قواعد Firestore).
