name: Build Android APK

on:
  push:
    branches: [claude/marhaba-xw3rqm]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6-stable"
  GODOT_VERSION_DIR: "4.6.stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build-tools & platform-tools
        run: yes | sdkmanager --install "platform-tools" "build-tools;34.0.0"

      - name: Download Godot editor
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          sudo mv /tmp/godot_bin/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Download & install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates ~/.local/share/godot/export_templates/${GODOT_VERSION_DIR}

      - name: Bootstrap editor settings & import project
        run: |
          godot --headless --editor --quit --path . || true

      - name: Point editor settings at the Android SDK
        run: |
          sed -i "s#export/android/android_sdk_path = \".*\"#export/android/android_sdk_path = \"${ANDROID_HOME}\"#" ~/.config/godot/editor_settings-${GODOT_VERSION_DIR%.stable}.tres

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/hijola_release.keystore \
            -alias hijola_release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hijola123 -keypass hijola123 \
            -dname "CN=Hijola, OU=La, O=La, L=Riyadh, ST=Riyadh, C=SA"

      - name: Export Android release APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/hijola-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hijola-android-apk
          path: build/android/*.apk
          retention-days: 30

      - name: Publish GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "هجولة - بناء أندرويد تجريبي #${{ github.run_number }}"
          body: |
            بناء تلقائي من فرع `${{ github.ref_name }}` (commit ${{ github.sha }}).
            مضمار Orsay الأصلي من Open Street Kart، للتحقق من سلسلة البناء قبل إضافة مضمار الرياض/بريدة.
          files: build/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
