name: Fetch Riyadh OSM data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install osmtogeojson
        run: npm install -g osmtogeojson

      - name: Query Overpass for the Kingdom Centre Tower area (Riyadh)
        run: |
          mkdir -p maps/riyadh
          cat > /tmp/query.overpassql << 'EOF'
          [out:json][timeout:60];
          (
            nwr(24.70808,46.67113,24.71508,46.67813);
          );
          out geom;
          EOF
          cp /tmp/query.overpassql maps/riyadh/riyadh.overpassql
          for endpoint in "https://overpass-api.de/api/interpreter" "https://overpass.kumi.systems/api/interpreter" "https://overpass.osm.ch/api/interpreter"; do
            echo "Trying $endpoint ..."
            if curl -sS --fail --retry 3 --retry-delay 5 --max-time 90 -X POST -d @/tmp/query.overpassql "$endpoint" -o /tmp/riyadh_raw.json; then
              echo "Success via $endpoint"
              break
            fi
            echo "Failed via $endpoint, trying next..."
          done
          test -s /tmp/riyadh_raw.json
          wc -c /tmp/riyadh_raw.json

      - name: Convert to GeoJSON (osmtogeojson)
        run: |
          osmtogeojson /tmp/riyadh_raw.json > /tmp/riyadh_osm_raw.geojson
          # osk's osm_data_generator.gd expects an "@id" property (e.g. "way/12345");
          # this osmtogeojson version emits it as plain "id" instead, so copy it over.
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/tmp/riyadh_osm_raw.geojson', 'utf8'));
            for (const f of d.features) {
              if (f.properties && f.properties.id && !f.properties['@id']) {
                f.properties['@id'] = f.properties.id;
              }
            }
            fs.writeFileSync('maps/riyadh/riyadh_osm.geojson', JSON.stringify(d));
            console.log('features:', d.features.length);
          "

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maps/riyadh/riyadh.overpassql maps/riyadh/riyadh_osm.geojson
          git commit -m "Fetch real OSM data for the Riyadh (Kingdom Centre Tower) track area" || echo "nothing to commit"
          git push
